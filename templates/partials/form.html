<div id="swap-area" class="mt-4">
  <form
    class="space-y-4"
    hx-post="/shorten"
    hx-target="#swap-area"
    hx-swap="outerHTML"
  >
    <div class="dui-input-group relative">
      <input
        class="dui-input font-mono w-full"
        type="text"
        name="original_url"
        placeholder="example.com/your/really/long/url"
        {% if value.is_some() %}
        value="{{ value.as_ref().unwrap() }}"
        {% endif %}
        required
      />
      <div class="pointer-events-none absolute inset-y-0 right-5 flex items-center text-[10px] font-bold uppercase tracking-[0.3em] text-base-content/40">
        ENTER
      </div>
    </div>
    {% if error.is_some() %}
    <div class="alert alert-error rounded-box border border-error/20 bg-error/10 text-error flex items-start text-sm font-medium p-4 shadow-sm">
      <i class="fa-solid fa-circle-xmark mt-0.5"></i>
      <span>{{ error.as_ref().unwrap() }}</span>
    </div>
    {% endif %}
    <button class="dui-btn dui-btn-primary w-full relative group h-12 mt-2" type="submit">
      <span class="htmx-indicator absolute inset-0 flex items-center justify-center">
        <span class="loading loading-spinner loading-md"></span>
      </span>
      <span class="htmx-indicator-hidden font-bold uppercase tracking-wider">SHORTEN</span>
    </button>
  </form>
</div>
