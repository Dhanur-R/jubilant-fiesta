<div id="swap-area" class="mt-8">
  <form
    class="space-y-4"
    hx-post="/shorten"
    hx-target="#swap-area"
    hx-swap="outerHTML"
  >
    <div class="relative">
      <input
        class="w-full border-2 border-neutral-700 bg-black px-5 py-4 font-mono text-base text-white placeholder:text-neutral-600 transition-colors focus:border-green-500 focus:outline-none"
        type="url"
        name="original_url"
        placeholder="https://example.com/your/really/long/url"
        {%
        if
        value.is_some()
        %}
        value="{{ value.as_ref().unwrap() }}"
        {%
        endif
        %}
        required
      />
      <div
        class="pointer-events-none absolute inset-y-0 right-5 flex items-center text-[10px] font-bold uppercase tracking-[0.3em] text-neutral-700"
      >
        ENTER
      </div>
    </div>
    {% if error.is_some() %}
    <div class="border-l-4 border-red-500 bg-red-950/30 px-4 py-3">
      <div class="flex items-start gap-3">
        <span class="text-lg font-bold text-red-500">✗</span>
        <p class="text-sm font-medium text-red-300">
          {{ error.as_ref().unwrap() }}
        </p>
      </div>
    </div>
    {% endif %}
    <button
      class="relative w-full border-2 border-green-500 bg-green-500 px-6 py-4 text-base font-bold uppercase tracking-wider text-black transition-all hover:bg-green-400 hover:border-green-400"
      type="submit"
    >
      <span
        class="htmx-indicator absolute inset-0 flex items-center justify-center bg-green-500"
      >
        <span
          class="inline-block h-4 w-4 animate-spin rounded-full border-2 border-black border-t-transparent"
        ></span>
      </span>
      <span class="htmx-indicator-hidden">SHORTEN</span>
    </button>
  </form>
</div>
