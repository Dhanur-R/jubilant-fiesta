<div id="swap-area" class="mt-8 space-y-6">
  <div class="border-2 border-neutral-800 bg-black p-8">
    <p class="mb-4 text-[10px] font-bold uppercase tracking-[0.3em] text-neutral-600">
      YOUR SHORTENED LINK
    </p>

    <div class="mt-4 flex items-center justify-between gap-4 border border-neutral-800 bg-neutral-950 p-4">
      <a
        class="break-all font-mono text-xl font-semibold text-green-400 transition-colors hover:text-green-300"
        href="{{ short_url }}"
        target="_blank"
        rel="noopener"
      >
        {{ short_url }}
      </a>

      <button
        class="shrink-0 border-2 border-green-500 px-5 py-2.5 text-xs font-bold uppercase text-green-500 transition-all hover:bg-green-500 hover:text-black active:scale-95"
        type="button"
        data-copy="{{ short_url }}"
        onclick="copyShortUrl(this)"
      >
        COPY
      </button>
    </div>

    <div class="mt-4 flex items-center gap-2 text-xs">
      <span class="text-neutral-600">CODE:</span>
      <code class="font-mono font-semibold text-neutral-300">{{ short_code }}</code>
    </div>
  </div>

  <a
    class="inline-flex items-center gap-2 border-b border-transparent text-sm font-medium text-neutral-400 transition hover:border-neutral-400 hover:text-white"
    href="/"
  >
    ← Shorten another link
  </a>
</div>
