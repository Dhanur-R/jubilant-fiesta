<div id="swap-area" class="mt-4 space-y-5">
  <div class="rounded-xl border border-base-content/10 bg-base-200/40 p-5">
    <p
      class="mb-3 text-[10px] font-bold uppercase tracking-[0.2em] text-base-content/60"
    >
      YOUR SHORTENED LINK
    </p>

    <div
      class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border border-base-content/15 bg-base-100/80 p-3.5 rounded-lg shadow-sm"
    >
      <a
        class="break-all font-mono text-base sm:text-lg font-semibold text-primary transition-colors hover:text-primary/80 no-underline"
        href="{{ short_url }}"
        target="_blank"
        rel="noopener"
      >
        {{ short_url }}
      </a>

      <button
        class="shrink-0 dui-btn dui-btn-ghost uppercase h-8 px-3 text-[11px]"
        type="button"
        data-copy="{{ short_url }}"
        data-action="copy-short-url"
      >
        COPY
      </button>
    </div>

    <div class="mt-3 flex items-center gap-2 text-xs">
      <span class="text-base-content/60 font-semibold">CODE:</span>
      <code class="font-mono font-bold text-base-content px-1.5 py-0.5 rounded bg-base-300/40"
        >{{ short_code }}</code
      >
    </div>
  </div>

  <a
    class="inline-flex items-center gap-2 text-sm font-medium text-base-content/60 transition hover:text-base-content no-underline"
    href="/"
  >
    <i class="fa-solid fa-arrow-left"></i> Shorten another link
  </a>
</div>
