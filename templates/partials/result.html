<div id="swap-area" class="mt-4 space-y-6">
  <div class="dui-surface border-0 bg-base-200/50">
    <div class="dui-surface-body p-6 md:p-8">
      <p
        class="mb-4 text-[10px] font-bold uppercase tracking-[0.3em] text-base-content/60"
      >
        YOUR SHORTENED LINK
      </p>

      <div
        class="mt-4 flex flex-col md:flex-row md:items-center justify-between gap-4 border border-base-content/20 bg-base-100 p-4 rounded-xl shadow-sm"
      >
        <a
          class="break-all font-mono text-lg md:text-xl font-semibold text-primary transition-colors hover:text-primary/80"
          href="{{ short_url }}"
          target="_blank"
          rel="noopener"
        >
          {{ short_url }}
        </a>

        <button
          class="shrink-0 dui-btn dui-btn-ghost uppercase h-8 px-3 text-[11px]"
          type="button"
          data-copy="{{ short_url }}"
          data-action="copy-short-url"
        >
          COPY
        </button>
      </div>

      <div class="mt-4 flex items-center gap-2 text-xs">
        <span class="text-base-content/60 font-semibold">CODE:</span>
        <code class="font-mono font-bold text-base-content"
          >{{ short_code }}</code
        >
      </div>
    </div>
  </div>

  <a
    class="inline-flex items-center gap-2 text-sm font-medium text-base-content/60 transition hover:text-base-content"
    href="/"
  >
    <i class="fa-solid fa-arrow-left"></i> Shorten another link
  </a>
</div>
