<!doctype html>

    <meta charset="UTF-8" />

    <link rel="icon" type="image/x-icon" href="https://dhanur.me/favicon.ico" />
    <link rel="stylesheet" href="https://dhanur.me/css/font-awesome.min.css" />
    <link rel="stylesheet" href="https://dhanur.me/css/dui.css" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://linkr.dhanur.me/" />
    <meta property="og:title" content="linkr — Modern URL Shortener & Link Analytics | dhanur.me" />

    <!-- Trusted Types default policy (must run before ANY script that uses innerHTML/script.src) -->
    <script>
      (function () {
        if (window.trustedTypes && window.trustedTypes.createPolicy) {
          try {
            window.__defaultPolicy = window.trustedTypes.createPolicy(
              "default",
              {
                createScriptURL: function (s) {
                  return s;
                },
                createHTML: function (s) {
                  return s;
                },
              },
            );
          } catch (e) {}
        }
        function installFramePolicy(m) {
          var orig = Element.prototype[m];
          Element.prototype[m] = function () {
            var r = orig.apply(this, arguments);
            var n = arguments[0];
            if (n && n.tagName === "IFRAME") {
              try {
                var w = n.contentWindow;
                if (w && w.trustedTypes && !w.trustedTypes.defaultPolicy) {
                  w.trustedTypes.createPolicy("default", {
                    createHTML: function (s) {
                      return s;
                    },
                    createScript: function (s) {
                      return s;
                    },
                    createScriptURL: function (s) {
                      return s;
                    },
                  });
                }
              } catch (e) {}
            }
            return r;
          };
        }
        installFramePolicy("appendChild");
        installFramePolicy("insertBefore");
      })();
    </script>

    <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>

    <!-- HTMX Indicator Styles -->
    <style>
      .htmx-indicator {
        display: none;
      }
      .htmx-request .htmx-indicator {
        display: inline-flex;
      }
      .htmx-request .htmx-indicator-hidden {
        display: none;
      }
    </style>

    <!-- 1. The Configuration Object (must be synchronously before shell.js) -->
    <script>
      window.SiteNavConfig = {
        mode: "navbar",
        nav: [
          {
            name: "Home",
            url: "https://dhanur.me/",
            icon: "fa-solid fa-house",
          },
        ],
        sidebarNav: [],
        activePath: window.location.pathname,
        badge: { text: "URL SHORTENER", class: "badge-primary" },
        showSearch: false,
        showAppsGrid: true,
        showThemeToggle: true,
        enablePwa: false,
        favicon: false,
      };
    </script>

    <!-- Local bindings for CSP-safe inline actions -->
    <script src="/static/js/site-bindings.js" type="text/javascript"></script>

    <!-- 2. The Abyssal Integration Script -->
    <script src="https://dhanur.me/js/shell.min.js" defer></script>
  </head>
  <body class="bg-base-100 text-base-content antialiased min-h-screen">
    <header id="dhanur-shell"></header>

    <main class="eco-page eco-container eco-container-compact">
      {% block content %}{% endblock %}

      <footer class="eco-footer">
        <span>&copy; <span id="year">2026</span> Dhanur Relhan</span>
        <div class="flex items-center gap-4">
          <a href="https://dhanur.me/" class="hover:text-base-content transition-colors">dhanur.me</a>
          <a href="https://github.com/kascit/linkr" class="hover:text-base-content transition-colors" target="_blank" rel="noopener noreferrer">Source</a>
        </div>
      </footer>
    </main>

    <script>
      document.getElementById('year').textContent = new Date().getFullYear();

      async function copyShortUrl(button) {
        const text = button.getAttribute("data-copy");
        if (!text) return;

        const originalText = button.textContent;

        try {
          await navigator.clipboard.writeText(text);
          button.textContent = "COPIED";
          button.classList.remove("btn-outline");
          button.classList.add("btn-success");

          setTimeout(() => {
            button.textContent = originalText;
            button.classList.remove("btn-success");
            button.classList.add("btn-outline");
          }, 2000);
        } catch (err) {
          button.textContent = "FAILED";
          button.classList.remove("btn-outline");
          button.classList.add("btn-error");

          setTimeout(() => {
            button.textContent = originalText;
            button.classList.remove("btn-error");
            button.classList.add("btn-outline");
          }, 2000);
        }
      }
    </script>
  </body>
</html>
