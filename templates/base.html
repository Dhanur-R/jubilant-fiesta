<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linkr</title>
    <!-- Required for FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    
    <!-- HTMX Indicator Styles -->
    <style>
      .htmx-indicator { display: none; }
      .htmx-request .htmx-indicator { display: inline-flex; }
      .htmx-request .htmx-indicator-hidden { display: none; }
    </style>

    <!-- 1. The Configuration Object (must be synchronously before shell.js) -->
    <script>
    window.SiteNavConfig = {
        mode: "navbar",
        nav: [
            { name: "Home", url: "https://dhanur.me/", icon: "fa-solid fa-house" }
        ],
        sidebarNav: [],
        activePath: window.location.pathname,
        badge: { text: "URL SHORTENER", class: "badge-primary" },
        showSearch: false,
        showAppsGrid: true,
        showThemeToggle: true
    };
    </script>

    <!-- 2. The Abyssal Integration Script -->
    <script type="module" src="https://dhanur.me/js/shell.js"></script>
</head>
<body>
    <main class="w-full max-w-7xl mx-auto p-4 lg:p-8">
        {% block content %}{% endblock %}
    </main>
    <script>
      async function copyShortUrl(button) {
        const text = button.getAttribute("data-copy");
        if (!text) return;

        const originalText = button.textContent;

        try {
          await navigator.clipboard.writeText(text);
          button.textContent = "COPIED";
          button.classList.remove("btn-outline");
          button.classList.add("btn-success");

          setTimeout(() => {
            button.textContent = originalText;
            button.classList.remove("btn-success");
            button.classList.add("btn-outline");
          }, 2000);
        } catch (err) {
          button.textContent = "FAILED";
          button.classList.remove("btn-outline");
          button.classList.add("btn-error");

          setTimeout(() => {
            button.textContent = originalText;
            button.classList.remove("btn-error");
            button.classList.add("btn-outline");
          }, 2000);
        }
      }
    </script>
</body>
</html>
